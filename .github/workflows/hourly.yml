name: Hourly WorldFront publishing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger hourly shop publish + rebuild
        env:
          HOURLY_CRON_TOKEN: ${{ secrets.HOURLY_CRON_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/wf-hourly.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${HOURLY_CRON_TOKEN}" \
            -H "Content-Type: application/json" \
            https://www.worldfront.news/api/cron/shop-tick)
          echo "status=$code"
          body=$(cat /tmp/wf-hourly.json)
          echo "response=$body"
          echo
          echo "published=$(echo "$body" | grep -o '"published":[a-z]*' | head -1)"
          echo "publish_detail=$(echo "$body" | grep -o '"mode":"[^"]*"\|"reason":"[^"]*"' | head -2)"
          echo "rebuild_detail=$(echo "$body" | grep -o '"via":"[^"]*"\|"rebuilt":[a-z]*\|"skipped":[a-z]*' | head -3)"
          echo "error=$(echo "$body" | grep -o '"error":"[^"]*"' | head -1)"
          if [ "$code" != "200" ]; then exit 1; fi